[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdi-lab-m2-2"
version = "1.0.0"
description = "Laboratorios M2.1 e M2.2 de Processamento de Imagens: segmentacao, componentes conexos e morfologia"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python"]

[project.scripts]
pdi_lab = "pdi_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
