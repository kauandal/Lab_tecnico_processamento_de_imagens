[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdi-lab-m2-1"
version = "1.0.0"
description = "Laboratorio M2.1 de Processamento de Imagens: mascara binaria e segmentacao"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python"]

[project.scripts]
pdi_lab = "pdi_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
